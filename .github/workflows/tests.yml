name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install.py --test
      - name: Test and verify the reviewed source package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            DOCKSCREEN_PYTHON=".venv/Scripts/python.exe"
          else
            DOCKSCREEN_PYTHON=".venv/bin/python"
          fi
          "$DOCKSCREEN_PYTHON" -m pytest -q
          "$DOCKSCREEN_PYTHON" scripts/source_release.py --check
          "$DOCKSCREEN_PYTHON" scripts/source_release.py --output dist/DockScreen-source.zip
